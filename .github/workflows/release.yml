name: Release asset

# GitHub'da bir sürüm (release) yayınlandığında skill zip'ini paketler ve o sürüme ekler.
# Sürümü oluşturmak elle yapılır; zip eklemek gerekmez. Zip zaten varsa güncellenir.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Zip'in ekleneceği sürüm etiketi (ör. v1.4.1)"
        required: true

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Skill zip'ini paketle
        run: sh tools/package.sh
      - name: Zip'i sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/reading-room-skill.zip --clobber
